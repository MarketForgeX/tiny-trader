<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiny Trader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header><span>🧸</span><h1>Tiny Trader</h1><span>⭐ <b id="score">0</b></span></header>

<div class="panda"><img src="panda.svg" alt="Cute seated panda"></div>

<section class="game">
  <div class="chart-wrap" aria-label="Price chart">
    <svg class="chart" viewBox="0 0 360 170" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#39bd73" stop-opacity=".28"/>
          <stop offset="100%" stop-color="#39bd73" stop-opacity=".03"/>
        </linearGradient>
      </defs>
      <path id="area" class="chart-area" d=""></path>
      <polyline id="chartLine" class="chart-line" points="" fill="none"></polyline>
      <circle id="dot" class="chart-dot" cx="0" cy="0" r="6"></circle>
    </svg>
  </div>

  <p id="instruction">Watch the arrow!</p>
  <div id="arrow">⬇️</div>
  <div id="hint">Price is going down</div>
  <div class="buttons">
    <button id="buy">🛒<small>BUY</small></button>
    <button id="sell">💰<small>SELL</small></button>
  </div>
  <div id="result">Tap the right button!</div>
</section>

<p class="footer">Learn: ⬇️ BUY • ⬆️ SELL</p>
</main>
<script src="script.js"></script>
</body>
</html>
