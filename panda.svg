  <ellipse cx="208" cy="311" rx="42" ry="29" fill="#242424"/>
  <ellipse cx="82" cy="309" rx="14" ry="17" fill="#555"/>
  <ellipse cx="218" cy="309" rx="14" ry="17" fill="#555"/>
  <circle cx="74" cy="301" r="5" fill="#f59b9b"/>
  <circle cx="89" cy="296" r="5" fill="#f59b9b"/>
  <circle cx="226" cy="301" r="5" fill="#f59b9b"/>
  <circle cx="211" cy="296" r="5" fill="#f59b9b"/>
