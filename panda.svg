  <ellipse cx="150" cy="164" rx="13" ry="10" fill="#171717"/>
  <path d="M150 173v8c0 8-8 13-17 13M150 181c0 8 8 13 17 13" fill="none" stroke="#171717" stroke-width="6" stroke-linecap="round"/>
  <circle cx="103" cy="177" r="11" fill="#ff9b9b" opacity=".45"/>
  <circle cx="197" cy="177" r="11" fill="#ff9b9b" opacity=".45"/>
